[package]
name = "kilna"
version = "0.43.0"
description = "A desktop workbench for content makers — from raw idea to shipped work."
authors = ["Kirill Lakhtachev <lahtachev@gmail.com>"]
license = "MIT"
repository = "https://github.com/lacodda/kilna"
edition = "2024"
rust-version = "1.85"
# Presentation rasters are for the README and the release page, not for anyone
# building from the crate. icon.ico stays: build.rs needs it on Windows.
exclude = [
    "../assets/screenshot.png",
    "../assets/social-preview.png",
    "../assets/logo-512.png",
    "../assets/apple-touch-icon.png",
    "../assets/favicon-32.png",
]

[lib]
name = "kilna_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled", "serde_json", "backup"] }
thiserror = "2"
# Held at 0.3.45: 0.3.55 requires Rust 1.88, and raising the MSRV of this
# application for a timestamp formatter is the wrong trade. Revisit when
# something else forces the floor up.
time = { version = "=0.3.45", features = ["formatting", "macros"] }
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "2.7.2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
