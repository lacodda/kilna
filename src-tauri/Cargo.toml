[package]
name = "kilna"
version = "0.91.1"
description = "A desktop workbench for content makers — from raw idea to shipped work."
authors = ["Kirill Lakhtachev <lahtachev@gmail.com>"]
license = "MIT"
repository = "https://github.com/lacodda/kilna"
edition = "2024"
rust-version = "1.90"
# Presentation rasters are for the README and the release page, not for anyone
# building from the crate. icon.ico stays: build.rs needs it on Windows.
exclude = [
    "../assets/screenshot.png",
    "../assets/social-preview.png",
    "../assets/logo-512.png",
    "../assets/apple-touch-icon.png",
    "../assets/favicon-32.png",
]

[lib]
name = "kilna_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled", "serde_json", "backup"] }
thiserror = "2"
time = { version = "0.3.55", features = ["formatting", "macros"] }
uuid = { version = "1", features = ["v4", "v5"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
# The window comes back the size and place it was closed at: a maximised
# window opens maximised, a 1200x1200 one opens at 1200x1200.
tauri-plugin-window-state = "2.5"
# A pasted picture arrives as bytes and needs a file to be copied from; the
# window is not given filesystem permissions for one temporary write.
tempfile = "3"
# Generates src/lib/api/generated/ from the Rust types that cross IPC, so the
# wire shape has one source instead of a hand-kept TypeScript twin (ADR 0003).
ts-rs = { version = "12", features = ["serde-json-impl"] }
# The language pack's dictionaries - the stress of three million Russian word
# forms, the frequency of their stems - are finite-state maps read where they
# lie in the binary, with no loading and no second copy in memory (ADR 0053).
fst = "0.4"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }

# Line-table debug info keeps backtraces readable while cutting the .pdb weight
# that dominates target/debug. Full debug info is a one-line revert when needed.
[profile.dev]
debug = 1
